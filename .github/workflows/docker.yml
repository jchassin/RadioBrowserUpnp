name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      dockerhub: ${{ steps.dockerhub.outputs.enabled }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Docker Hub publishing is enabled by creating the repository secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
      - name: Detect Docker Hub publishing
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "dockerhub_image=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/radiobrowserupnp" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "dockerhub_image=" >> "$GITHUB_OUTPUT"
          fi

      # Diagnostic only: asks Docker Hub for a push-capable token using the
      # configured credentials and prints ONLY the http status / scopes -
      # never the token itself.
      - name: Diagnose Docker Hub token scopes
        if: github.event_name != 'pull_request'
        run: |
          RESP=$(curl -s -o /tmp/token.json -w "%{http_code}" -u "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${{ secrets.DOCKERHUB_USERNAME }}/radiobrowserupnp:pull,push")
          echo "auth.docker.io returned http $RESP"
          python3 -c "import json;d=json.load(open('/tmp/token.json'));print('token scopes:',d.get('token','')[:0] or 'granted' if 'token' in d else d)" 2>/dev/null || cat /tmp/token.json | head -c 300
          echo
          if [ "$RESP" != "200" ]; then
            echo "::error::Docker Hub refused to issue a push token - the DOCKERHUB_TOKEN secret is not Read & Write, or the username does not own the token"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Standard login-action (no registry override): it writes credentials
      # for ALL docker.io aliases (docker.io / index.docker.io /
      # registry-1.docker.io), which buildx resolves when pushing.
      # The root cause of the earlier 401s was the broken condition fixed in
      # PR #5 (the login never ran; buildx then pushed anonymously).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.dockerhub_image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations stored alongside the image in GHCR
          # (Docker Hub does not support attestations): SLSA provenance
          # (sources, builder, timestamps) and SBOM (component inventory).
          provenance: mode=max
          sbom: true

  # Verify the published image against its provenance: the attestation must
  # reference THIS run's commit - the guarantee that the image tagged X was
  # built from the sources of X. A tampered or manually re-pushed image
  # breaks this check and fails the workflow.
  verify:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image provenance against this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e
          echo "Verifying provenance of ${IMAGE}"
          # gh attestation verify checks the signed SLSA provenance of this
          # exact image digest AND (--source-digest) that it was built from
          # the source commit of THIS run - the guarantee that the image
          # tagged X was built from the sources of X. Any mismatch (tampered
          # or re-pushed image) fails the workflow.
          gh attestation verify "${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --source-digest "sha1:${EXPECTED_COMMIT}" \
            --format json > /tmp/attestations.json
          echo "Provenance OK - image matches sources ${EXPECTED_COMMIT}"
